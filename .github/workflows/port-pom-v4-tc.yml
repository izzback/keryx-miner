name: Port PoM v4 Tensor Core host wiring

on:
  push:
    branches:
      - perf/pom-v4-tensor-core-supr-0.11.6

permissions:
  contents: write

jobs:
  wire-host:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/pom-v4-tensor-core-supr-0.11.6
          fetch-depth: 0

      - name: Apply guarded source transform
        run: python3 tools/port_pom_v4_tc.py

      - name: Commit host wiring if changed
        shell: bash
        run: |
          if git diff --quiet -- src/pom_gpu.rs; then
            echo "No host wiring change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pom_gpu.rs
          git commit -m "perf(pom-v4): wire tensor-core solver dispatch"
          git push origin HEAD:perf/pom-v4-tensor-core-supr-0.11.6
