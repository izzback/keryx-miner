name: Escrow claim fix test release

on:
  push:
    branches: ["test/escrow-claim-fix-v0.4.9"]

permissions:
  contents: write

jobs:
  patch-test-release:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      KERYX_LLAMA_SKIP: "1"
      POM_SM_LIST: "89"
      KERYX_LLAMA_ARCHS: "89-virtual"
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply escrow claim fix
        run: python tools/apply_escrow_fix.py

      - name: Format patched source
        run: cargo fmt --all

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: false
          use-local-cache: false

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          vsversion: "2022"

      - name: Compile targeted escrow regression test
        run: cargo test -p keryx-miner --lib --no-run legacy_escrows_are_claimed_before_h6_batch_and_h6_cycle_continues -- --exact

      - name: Build Windows release binary
        run: cargo build -p keryx-miner --release --bin keryx-miner

      - name: Package test binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/keryx-miner.exe dist/keryx-miner-v0.4.9-escrow-fix-test.1-win64.exe
          @"
          Keryx Miner v0.4.9-escrow-fix-test.1

          Escrow fix test build for NVIDIA sm_89 / RTX 5080.
          Fixes automated escrow claims when legacy 36,000-DAA coinbase escrows coexist with H6 792,000-DAA escrows.
          Legacy pre-H6 coinbase rewards are reclaimed first; subsequent claims use homogeneous 792,000-DAA batches.

          The regression test is compiled in CI but not executed because GitHub-hosted Windows runners have no NVIDIA runtime; execute the test and live escrow claim on the RTX 5080 host.
          Build mode: KERYX_LLAMA_SKIP=1. Use the existing libkeryx-llama.dll from your normal miner package if needed.
          This is a TEST prerelease. Do not use it as a production release until the live escrow claim is confirmed.
          "@ | Set-Content dist/README-escrow-fix-test.txt -Encoding utf8
          $hash = (Get-FileHash dist/keryx-miner-v0.4.9-escrow-fix-test.1-win64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  keryx-miner-v0.4.9-escrow-fix-test.1-win64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path dist/* -DestinationPath keryx-miner-v0.4.9-escrow-fix-test.1-win64.zip -Force

      - name: Commit patched source and remove temporary files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/escrow.rs Cargo.toml
          git rm .github/workflows/apply-escrow-fix-test.yml tools/apply_escrow_fix.py
          git commit -m "fix(escrow): separate claim batches by CSV window"
          git push origin HEAD:test/escrow-claim-fix-v0.4.9

      - name: Create GitHub test prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.9-escrow-fix-test.1"
          gh release create $tag dist/keryx-miner-v0.4.9-escrow-fix-test.1-win64.exe keryx-miner-v0.4.9-escrow-fix-test.1-win64.zip dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target test/escrow-claim-fix-v0.4.9 `
            --title "Keryx Miner v0.4.9-escrow-fix-test.1" `
            --notes "TEST prerelease: fixes escrow claim starvation when legacy 36,000-DAA coinbase escrows coexist with H6 792,000-DAA escrows. Includes a regression test reproducing the 16-legacy + 100-H6 scenario. Legacy pre-H6 coinbase rewards are claimed first; the next claim returns to homogeneous 792,000-DAA batches. This Windows binary is intentionally limited to the sm_89 / RTX 5080 PoM PTX image for focused escrow testing." `
            --prerelease
