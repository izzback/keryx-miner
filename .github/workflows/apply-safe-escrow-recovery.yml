name: Apply safe escrow recovery patch

on:
  push:
    branches:
      - fix/escrow-csv-window-claim-selection

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-guard]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/escrow-csv-window-claim-selection
          fetch-depth: 0

      - name: Patch recovery to merge instead of overwrite
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text(encoding="utf-8")

          old_fn = r'''fn recovered_escrow_state(api_entries: Vec<ApiEscrowEntry>) -> Result<(escrow::EscrowState, u64), String> {
              let mut entries = Vec::with_capacity(api_entries.len());
              let mut outpoints = std::collections::HashSet::with_capacity(api_entries.len());
              let mut total_sompi = 0u64;
              for api_entry in api_entries {
                  if api_entry.coinbase_txid.len() != 64 || !api_entry.coinbase_txid.bytes().all(|b| b.is_ascii_hexdigit()) {
                      return Err("Recovery API returned an invalid coinbase transaction ID".into());
                  }
                  if api_entry.block_hash.len() != 64 || !api_entry.block_hash.bytes().all(|b| b.is_ascii_hexdigit()) {
                      return Err("Recovery API returned an invalid block hash".into());
                  }
                  let confirm_daa = u64::try_from(api_entry.confirm_daa)
                      .map_err(|_| "Recovery API returned a negative confirmation DAA score")?;
                  let amount_sompi =
                      u64::try_from(api_entry.amount_sompi).map_err(|_| "Recovery API returned a negative escrow amount")?;
                  if amount_sompi == 0 {
                      return Err("Recovery API returned a zero escrow amount".into());
                  }
                  let output_index =
                      u32::try_from(api_entry.output_index).map_err(|_| "Recovery API returned an invalid output index")?;
                  let coinbase_txid = api_entry.coinbase_txid.to_ascii_lowercase();
                  if !outpoints.insert((coinbase_txid.clone(), output_index)) {
                      return Err("Recovery API returned a duplicate escrow outpoint".into());
                  }
                  total_sompi = total_sompi.checked_add(amount_sompi).ok_or("Recovered escrow amount overflow")?;
                  entries.push(escrow::EscrowEntry {
                      coinbase_txid,
                      block_hash: api_entry.block_hash.to_ascii_lowercase(),
                      confirm_daa,
                      amount_sompi,
                      output_index,
                      claimed: false,
                      slashed: false,
                      orphan_slashed: false,
                      orphan_retries: 0,
                      orphan_retry_after_daa: None,
                      submit_retries: 0,
                      batch_cap: 0,
                      cap_set_daa: 0,
                      is_inference: false,
                      csv_window: escrow::csv_window_for_daa(confirm_daa),
                  });
              }
              Ok((escrow::EscrowState { entries }, total_sompi))
          }
          '''

          new_fn = r'''fn recovered_escrow_state(api_entries: Vec<ApiEscrowEntry>) -> Result<(escrow::EscrowState, u64), String> {
              let mut entries = Vec::with_capacity(api_entries.len());
              let mut outpoints = std::collections::HashSet::with_capacity(api_entries.len());
              let mut total_sompi = 0u64;
              for api_entry in api_entries {
                  if api_entry.coinbase_txid.len() != 64 || !api_entry.coinbase_txid.bytes().all(|b| b.is_ascii_hexdigit()) {
                      return Err("Recovery API returned an invalid coinbase transaction ID".into());
                  }
                  if api_entry.block_hash.len() != 64 || !api_entry.block_hash.bytes().all(|b| b.is_ascii_hexdigit()) {
                      return Err("Recovery API returned an invalid block hash".into());
                  }
                  let confirm_daa = u64::try_from(api_entry.confirm_daa)
                      .map_err(|_| "Recovery API returned a negative confirmation DAA score")?;
                  let amount_sompi =
                      u64::try_from(api_entry.amount_sompi).map_err(|_| "Recovery API returned a negative escrow amount")?;
                  if amount_sompi == 0 {
                      return Err("Recovery API returned a zero escrow amount".into());
                  }
                  let output_index =
                      u32::try_from(api_entry.output_index).map_err(|_| "Recovery API returned an invalid output index")?;
                  let coinbase_txid = api_entry.coinbase_txid.to_ascii_lowercase();
                  if !outpoints.insert((coinbase_txid.clone(), output_index)) {
                      return Err("Recovery API returned a duplicate escrow outpoint".into());
                  }
                  total_sompi = total_sompi.checked_add(amount_sompi).ok_or("Recovered escrow amount overflow")?;
                  entries.push(escrow::EscrowEntry {
                      coinbase_txid,
                      block_hash: api_entry.block_hash.to_ascii_lowercase(),
                      confirm_daa,
                      amount_sompi,
                      output_index,
                      claimed: false,
                      slashed: false,
                      orphan_slashed: false,
                      orphan_retries: 0,
                      orphan_retry_after_daa: None,
                      submit_retries: 0,
                      batch_cap: 0,
                      cap_set_daa: 0,
                      is_inference: false,
                      csv_window: escrow::csv_window_for_daa(confirm_daa),
                  });
              }
              Ok((escrow::EscrowState { entries }, total_sompi))
          }

          fn merge_recovered_escrow_state(
              mut existing: escrow::EscrowState,
              recovered: escrow::EscrowState,
          ) -> Result<(escrow::EscrowState, usize), String> {
              let mut known = std::collections::HashMap::<(String, u32), usize>::with_capacity(existing.entries.len());
              for (index, entry) in existing.entries.iter().enumerate() {
                  let key = (entry.coinbase_txid.to_ascii_lowercase(), entry.output_index);
                  if known.insert(key.clone(), index).is_some() {
                      return Err(format!(
                          "Existing escrow state contains duplicate outpoint {}:{} — refusing destructive recovery",
                          key.0, key.1
                      ));
                  }
              }

              let mut added = 0usize;
              for mut entry in recovered.entries {
                  let key = (entry.coinbase_txid.to_ascii_lowercase(), entry.output_index);
                  if let Some(&existing_index) = known.get(&key) {
                      let old = &existing.entries[existing_index];
                      if old.amount_sompi != entry.amount_sompi
                          || old.confirm_daa != entry.confirm_daa
                          || (!old.block_hash.is_empty()
                              && !entry.block_hash.is_empty()
                              && !old.block_hash.eq_ignore_ascii_case(&entry.block_hash))
                      {
                          return Err(format!(
                              "Recovery API metadata mismatch for existing escrow outpoint {}:{} — refusing to overwrite local state",
                              key.0, key.1
                          ));
                      }
                      // Preserve every local status/cooldown/window field. Recovery must never
                      // resurrect a claimed/slashed entry or erase a legacy CSV-window decision.
                      continue;
                  }

                  entry.coinbase_txid = key.0.clone();
                  known.insert(key, existing.entries.len());
                  existing.entries.push(entry);
                  added += 1;
              }
              Ok((existing, added))
          }

          fn load_existing_escrow_state_for_recovery(path: &std::path::Path) -> Result<escrow::EscrowState, String> {
              match fs::read_to_string(path) {
                  Ok(raw) => serde_json::from_str(&raw).map_err(|e| {
                      format!(
                          "Existing escrow state '{}' is corrupt: {}. Refusing --recover-escrow so the file is not overwritten.",
                          path.display(), e
                      )
                  }),
                  Err(e) if e.kind() == std::io::ErrorKind::NotFound => Ok(escrow::EscrowState::default()),
                  Err(e) => Err(format!("Failed to read existing escrow state '{}': {}", path.display(), e)),
              }
          }

          fn backup_existing_escrow_state(path: &std::path::Path) -> Result<Option<std::path::PathBuf>, String> {
              if !path.exists() {
                  return Ok(None);
              }
              let timestamp = std::time::SystemTime::now()
                  .duration_since(std::time::UNIX_EPOCH)
                  .map_err(|e| format!("System clock error while naming escrow backup: {}", e))?
                  .as_secs();
              let file_name = path.file_name().and_then(|s| s.to_str()).unwrap_or("escrow_state.json");
              let backup_name = format!("{}.pre-recover.{}.{}.bak", file_name, timestamp, std::process::id());
              let backup_path = path.with_file_name(backup_name);
              fs::copy(path, &backup_path).map_err(|e| {
                  format!(
                      "Failed to back up existing escrow state '{}' to '{}': {}",
                      path.display(), backup_path.display(), e
                  )
              })?;
              Ok(Some(backup_path))
          }

          fn pending_total_sompi(state: &escrow::EscrowState) -> Result<u64, String> {
              state
                  .entries
                  .iter()
                  .filter(|e| !e.claimed && !e.slashed && !e.orphan_slashed && e.orphan_retries == 0)
                  .try_fold(0u64, |total, e| {
                      total.checked_add(e.amount_sompi).ok_or_else(|| "Escrow pending amount overflow".to_string())
                  })
          }
          '''

          if old_fn not in text:
              raise SystemExit("expected recovered_escrow_state block not found; refusing blind patch")
          text = text.replace(old_fn, new_fn, 1)

          old_tests = r'''#[cfg(test)]
          mod recovery_tests {
              use super::*;

              fn api_entry() -> ApiEscrowEntry {
                  ApiEscrowEntry {
                      coinbase_txid: "AB".repeat(32),
                      block_hash: "CD".repeat(32),
                      confirm_daa: 10,
                      amount_sompi: 20,
                      output_index: 1,
                  }
              }

              #[test]
              fn recovery_validates_and_normalizes_entries() {
                  let (state, total) = recovered_escrow_state(vec![api_entry()]).unwrap();
                  assert_eq!(total, 20);
                  assert_eq!(state.entries[0].coinbase_txid, "ab".repeat(32));
                  assert_eq!(state.entries[0].block_hash, "cd".repeat(32));
              }

              #[test]
              fn recovery_rejects_invalid_network_values() {
                  let mut entry = api_entry();
                  entry.confirm_daa = -1;
                  assert!(recovered_escrow_state(vec![entry]).is_err());

                  let mut entry = api_entry();
                  entry.output_index = i64::from(u32::MAX) + 1;
                  assert!(recovered_escrow_state(vec![entry]).is_err());

                  let mut entry = api_entry();
                  entry.coinbase_txid = "not-a-hash".into();
                  assert!(recovered_escrow_state(vec![entry]).is_err());

                  assert!(recovered_escrow_state(vec![api_entry(), api_entry()]).is_err());
              }
          }
          '''

          new_tests = r'''#[cfg(test)]
          mod recovery_tests {
              use super::*;

              fn api_entry() -> ApiEscrowEntry {
                  ApiEscrowEntry {
                      coinbase_txid: "AB".repeat(32),
                      block_hash: "CD".repeat(32),
                      confirm_daa: 10,
                      amount_sompi: 20,
                      output_index: 1,
                  }
              }

              fn state_entry(tx_byte: &str, index: u32) -> escrow::EscrowEntry {
                  escrow::EscrowEntry {
                      coinbase_txid: tx_byte.repeat(32),
                      block_hash: "11".repeat(32),
                      confirm_daa: 10,
                      amount_sompi: 20,
                      output_index: index,
                      claimed: false,
                      slashed: false,
                      orphan_slashed: false,
                      orphan_retries: 0,
                      orphan_retry_after_daa: None,
                      submit_retries: 0,
                      batch_cap: 0,
                      cap_set_daa: 0,
                      is_inference: false,
                      csv_window: 36_000,
                  }
              }

              #[test]
              fn recovery_validates_and_normalizes_entries() {
                  let (state, total) = recovered_escrow_state(vec![api_entry()]).unwrap();
                  assert_eq!(total, 20);
                  assert_eq!(state.entries[0].coinbase_txid, "ab".repeat(32));
                  assert_eq!(state.entries[0].block_hash, "cd".repeat(32));
              }

              #[test]
              fn recovery_rejects_invalid_network_values() {
                  let mut entry = api_entry();
                  entry.confirm_daa = -1;
                  assert!(recovered_escrow_state(vec![entry]).is_err());

                  let mut entry = api_entry();
                  entry.output_index = i64::from(u32::MAX) + 1;
                  assert!(recovered_escrow_state(vec![entry]).is_err());

                  let mut entry = api_entry();
                  entry.coinbase_txid = "not-a-hash".into();
                  assert!(recovered_escrow_state(vec![entry]).is_err());

                  assert!(recovered_escrow_state(vec![api_entry(), api_entry()]).is_err());
              }

              #[test]
              fn recovery_merge_preserves_entries_missing_from_api() {
                  let old = state_entry("aa", 1);
                  let existing = escrow::EscrowState { entries: vec![old.clone()] };
                  let recovered = escrow::EscrowState::default();
                  let (merged, added) = merge_recovered_escrow_state(existing, recovered).unwrap();
                  assert_eq!(added, 0);
                  assert_eq!(merged.entries.len(), 1);
                  assert_eq!(merged.entries[0].coinbase_txid, old.coinbase_txid);
              }

              #[test]
              fn recovery_merge_adds_only_new_outpoints() {
                  let existing = escrow::EscrowState { entries: vec![state_entry("aa", 1)] };
                  let recovered = escrow::EscrowState { entries: vec![state_entry("bb", 2)] };
                  let (merged, added) = merge_recovered_escrow_state(existing, recovered).unwrap();
                  assert_eq!(added, 1);
                  assert_eq!(merged.entries.len(), 2);
              }

              #[test]
              fn recovery_merge_never_resets_existing_terminal_status() {
                  let mut old = state_entry("aa", 1);
                  old.claimed = true;
                  old.slashed = true;
                  old.csv_window = 792_000;
                  let mut api_copy = old.clone();
                  api_copy.claimed = false;
                  api_copy.slashed = false;
                  api_copy.csv_window = 36_000;
                  let (merged, added) = merge_recovered_escrow_state(
                      escrow::EscrowState { entries: vec![old] },
                      escrow::EscrowState { entries: vec![api_copy] },
                  )
                  .unwrap();
                  assert_eq!(added, 0);
                  assert!(merged.entries[0].claimed);
                  assert!(merged.entries[0].slashed);
                  assert_eq!(merged.entries[0].csv_window, 792_000);
              }

              #[test]
              fn recovery_merge_rejects_duplicate_existing_outpoints() {
                  let entry = state_entry("aa", 1);
                  let existing = escrow::EscrowState { entries: vec![entry.clone(), entry] };
                  assert!(merge_recovered_escrow_state(existing, escrow::EscrowState::default()).is_err());
              }

              #[test]
              fn recovery_merge_rejects_metadata_mismatch() {
                  let old = state_entry("aa", 1);
                  let mut changed = old.clone();
                  changed.amount_sompi += 1;
                  assert!(merge_recovered_escrow_state(
                      escrow::EscrowState { entries: vec![old] },
                      escrow::EscrowState { entries: vec![changed] },
                  )
                  .is_err());
              }

              #[test]
              fn recovery_load_fails_closed_on_corrupt_existing_file() {
                  let dir = tempfile::tempdir().unwrap();
                  let path = dir.path().join("escrow_state.json");
                  fs::write(&path, b"{broken").unwrap();
                  assert!(load_existing_escrow_state_for_recovery(&path).is_err());
                  assert_eq!(fs::read(&path).unwrap(), b"{broken");
              }
          }
          '''

          if old_tests not in text:
              raise SystemExit("expected recovery_tests block not found; refusing blind patch")
          text = text.replace(old_tests, new_tests, 1)

          old_recovery = r'''    // Recovery mode: rebuild escrow_state.json from the Keryx public API, then exit.
              // Must run before escrow key loading to avoid creating a new random key on disk.
              // Uses escrow.key to derive the pubkey — only claimable UTXOs are returned.
          '''
          new_recovery = r'''    // Recovery mode: merge claimable UTXOs from the Keryx public API into the existing
              // escrow_state.json, then exit. Existing entries are authoritative and never deleted or
              // reset by recovery; the current file is backed up before the atomic merged write.
              // Must run before escrow key loading to avoid creating a new random key on disk.
              // Uses escrow.key to derive the pubkey — only claimable UTXOs are returned.
          '''
          if old_recovery not in text:
              raise SystemExit("expected recovery comment not found")
          text = text.replace(old_recovery, new_recovery, 1)

          old_save = r'''        let (state, total_sompi) = recovered_escrow_state(api_entries)?;
              let count = state.entries.len();
              if shutdown_requested.load(Ordering::Acquire) {
                  return Err("Shutdown requested before recovered escrow state was saved".into());
              }
              escrow::save_state_atomic(std::path::Path::new(&opt.escrow_state_file), &state)?;

              info!("Recovered {} escrow entries — claimable: {:.4} KRX", count, total_sompi as f64 / 1e8);
              info!("State saved to '{}'.", opt.escrow_state_file);
          '''

          new_save = r'''        let (recovered, api_total_sompi) = recovered_escrow_state(api_entries)?;
              let api_count = recovered.entries.len();
              let state_path = std::path::Path::new(&opt.escrow_state_file);
              let existing = load_existing_escrow_state_for_recovery(state_path)?;
              let existing_count = existing.entries.len();
              let (state, added_count) = merge_recovered_escrow_state(existing, recovered)?;
              let final_count = state.entries.len();
              let final_pending_sompi = pending_total_sompi(&state)?;
              if final_count < existing_count {
                  return Err("Internal recovery invariant violated: merged state became smaller than existing state".into());
              }
              if shutdown_requested.load(Ordering::Acquire) {
                  return Err("Shutdown requested before recovered escrow state was saved".into());
              }
              if let Some(backup) = backup_existing_escrow_state(state_path)? {
                  info!("Existing escrow state backed up to '{}'.", backup.display());
              }
              escrow::save_state_atomic(state_path, &state)?;

              info!(
                  "Recovery merge complete — API: {} entries / {:.4} KRX; existing preserved: {}; new added: {}; final tracked: {} / {:.4} KRX pending",
                  api_count,
                  api_total_sompi as f64 / 1e8,
                  existing_count,
                  added_count,
                  final_count,
                  final_pending_sompi as f64 / 1e8
              );
              info!("Merged state saved atomically to '{}'.", opt.escrow_state_file);
          '''

          if old_save not in text:
              raise SystemExit("expected destructive recovery save block not found; refusing blind patch")
          text = text.replace(old_save, new_save, 1)

          path.write_text(text, encoding="utf-8")

      - name: Format patched Rust source
        run: rustfmt --edition 2021 src/main.rs

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q "Recovery merge complete" src/main.rs
          grep -q "recovery_merge_preserves_entries_missing_from_api" src/main.rs
          grep -q "pre-recover" src/main.rs

      - name: Commit safe recovery patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main.rs; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "fix: make escrow recovery non-destructive [recovery-guard]"
          git push origin HEAD:fix/escrow-csv-window-claim-selection
