name: Normalize test.3 escrow tests

on:
  push:
    branches:
      - test/escrow-safe-recovery-v0.4.9-test.3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[test3-test-attrs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/escrow-safe-recovery-v0.4.9-test.3
          fetch-depth: 0
      - name: Fix test attributes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/escrow.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    #[test]\n    #[test]\n    fn legacy_escrows_are_claimed_before_h6_batch_and_h6_cycle_continues()',
              '    #[test]\n    fn legacy_escrows_are_claimed_before_h6_batch_and_h6_cycle_continues()',
              1,
          )
          marker = '    fn csv_window_follows_the_gate()'
          if marker in s and '    #[test]\n    fn csv_window_follows_the_gate()' not in s:
              s = s.replace(marker, '    #[test]\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          rustfmt --edition 2021 src/escrow.rs
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('src/escrow.rs').read_text()
          assert '#[test]\n    #[test]\n    fn legacy_escrows_are_claimed' not in s
          assert '#[test]\n    fn csv_window_follows_the_gate()' in s
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/escrow.rs
          if ! git diff --cached --quiet; then
            git commit -m "test: normalize escrow regression attributes [test3-test-attrs]"
            git push origin HEAD:test/escrow-safe-recovery-v0.4.9-test.3
          fi
