name: Build fast escrow recovery test.4 Windows prerelease

on:
  push:
    branches:
      - test/escrow-safe-recovery-v0.4.9-test.3

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      KERYX_LLAMA_SKIP: "1"
      POM_SM_LIST: "89"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: test/escrow-safe-recovery-v0.4.9-test.3
          fetch-depth: 0

      - name: Verify test.4 source and recovery guard
        shell: pwsh
        run: |
          Select-String -Path Cargo.toml -Pattern 'version = "0.4.9-escrow-fix-test.4"' | Out-Null
          Select-String -Path src/main.rs -Pattern 'Recovery merge complete' | Out-Null
          Select-String -Path src/main.rs -Pattern 'pre-recover' | Out-Null
          Select-String -Path src/escrow.rs -Pattern 'raw rejection for claim' | Out-Null

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Install minimal CUDA 12.9
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: false
          use-local-cache: false

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          vsversion: "2022"

      - name: Limit PoM PTX to RTX 5080 sm89 for this test binary only
        shell: pwsh
        run: |
          $p = 'src/pom_gpu.rs'
          $t = Get-Content $p -Raw
          $oldConsts = @'
const PTX_SM90: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm90.ptx"));
const PTX_SM89: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm89.ptx"));
const PTX_SM86: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm86.ptx"));
const PTX_SM80: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm80.ptx"));
const PTX_SM75: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm75.ptx"));
const PTX_SM70: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm70.ptx"));
const PTX_SM61: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm61.ptx"));
'@
          $newConsts = @'
const PTX_SM89: &str = include_str!(concat!(env!("OUT_DIR"), "/pom_mine_sm89.ptx"));
'@
          $oldCandidates = @'
const POM_PTX_CANDIDATES: [(&str, &str, &str); 7] = [
    ("pom_mine_mod_sm90", "sm_90", PTX_SM90),
    ("pom_mine_mod_sm89", "sm_89", PTX_SM89),
    ("pom_mine_mod_sm86", "sm_86", PTX_SM86),
    ("pom_mine_mod_sm80", "sm_80", PTX_SM80),
    ("pom_mine_mod_sm75", "sm_75", PTX_SM75),
    ("pom_mine_mod_sm70", "sm_70", PTX_SM70),
    ("pom_mine_mod_sm61", "sm_61", PTX_SM61),
];
'@
          $newCandidates = @'
const POM_PTX_CANDIDATES: [(&str, &str, &str); 1] = [
    ("pom_mine_mod_sm89", "sm_89", PTX_SM89),
];
'@
          if (-not $t.Contains($oldConsts)) { throw 'PTX const block not found' }
          if (-not $t.Contains($oldCandidates)) { throw 'PTX candidate block not found' }
          $t = $t.Replace($oldConsts, $newConsts).Replace($oldCandidates, $newCandidates)
          Set-Content $p $t -Encoding utf8
          Write-Host 'Hosted build patched to sm89 only; source branch remains multi-arch.'

      - name: Build miner and matched CUDA plugin only
        shell: pwsh
        run: |
          Write-Host "KERYX_LLAMA_SKIP=$env:KERYX_LLAMA_SKIP"
          Write-Host "POM_SM_LIST=$env:POM_SM_LIST"
          nvcc --version
          cargo build -p keryx-miner -p keryxcuda --release

      - name: Verify matched runtime files
        shell: pwsh
        run: |
          $required = @('target/release/keryx-miner.exe','target/release/keryxcuda.dll')
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required runtime file: $f" }
            Write-Host "$f -> $((Get-Item $f).Length) bytes"
          }

      - name: Package test.4 without llama
        shell: pwsh
        run: |
          $dist = 'dist-v0.4.9-escrow-fix-test.4'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/keryx-miner.exe $dist/
          Copy-Item target/release/keryxcuda.dll $dist/
          @"
Keryx Miner v0.4.9-escrow-fix-test.4

FAST TEST BUILD — safe escrow recovery + mixed CSV-window claim handling.

IMPORTANT RUNTIME INSTRUCTION:
- This ZIP intentionally does NOT contain keryx-llama.dll.
- Reuse the SAME old keryx-llama.dll that already works on your machine with the previous miner/model runtime.
- Put that working keryx-llama.dll beside the new keryx-miner.exe and keryxcuda.dll.
- keryx-miner.exe and keryxcuda.dll in this ZIP MUST stay together because they come from the same Rust build.

Build scope:
- Windows x64
- CUDA 12.9
- RTX 5080 focused PoM PTX: sm_89 only
- KERYX_LLAMA_SKIP=1 (llama runtime reused, not rebuilt)

Safe --recover-escrow behavior:
- existing escrow_state.json entries are preserved when the recovery API omits them;
- API results are merged by txid + output_index;
- existing claimed/slashed/retry/csv_window state is preserved;
- corrupt/duplicate/conflicting state fails closed;
- automatic pre-recovery .bak is created before writing;
- merged entry count cannot become smaller than the existing state.

Claim behavior:
- 36,000 and 792,000 DAA windows remain separated;
- H6 maturity remains 792,000 DAA per entry;
- a short legacy window cannot block a full H6 batch;
- detailed raw rejection / burned-outpoint diagnostics are enabled.

LIVE TEST:
- Work only from a COPY of the clean recovery JSON.
- Never overwrite the clean master backup.
- Keep and reuse the original escrow.key.
"@ | Set-Content "$dist/README-TEST.txt" -Encoding utf8

          $hashLines = foreach ($f in @('keryx-miner.exe','keryxcuda.dll','README-TEST.txt')) {
            $h = (Get-FileHash "$dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $hashLines | Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$dist/*" -DestinationPath 'keryx-miner-v0.4.9-escrow-fix-test.4-win64.zip' -Force
          $zipHash = (Get-FileHash 'keryx-miner-v0.4.9-escrow-fix-test.4-win64.zip' -Algorithm SHA256).Hash.ToLower()
          Set-Content 'ZIP-SHA256.txt' "$zipHash  keryx-miner-v0.4.9-escrow-fix-test.4-win64.zip" -Encoding ascii
          Write-Host "ZIP SHA256=$zipHash"

      - name: Remove one-shot workflow and finalize release head
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-safe-recovery-test3.yml
          git commit -m "chore: finalize fast escrow recovery test.4 release head"
          git push origin HEAD:test/escrow-safe-recovery-v0.4.9-test.3

      - name: Create GitHub prerelease test.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.4.9-escrow-fix-test.4' `
            'keryx-miner-v0.4.9-escrow-fix-test.4-win64.zip' `
            'dist-v0.4.9-escrow-fix-test.4/keryx-miner.exe' `
            'dist-v0.4.9-escrow-fix-test.4/keryxcuda.dll' `
            'dist-v0.4.9-escrow-fix-test.4/SHA256SUMS.txt' `
            'ZIP-SHA256.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target test/escrow-safe-recovery-v0.4.9-test.3 `
            --title 'Keryx Miner v0.4.9-escrow-fix-test.4' `
            --notes 'FAST TEST prerelease. Safe non-destructive escrow recovery + 36k/792k claim fix. Windows RTX 5080/sm89 build. Ships matched keryx-miner.exe + keryxcuda.dll only; intentionally reuse your already-working old keryx-llama.dll. Built with KERYX_LLAMA_SKIP=1 to avoid rebuilding llama.cpp.' `
            --prerelease
