name: Build patched Keryx miner HiveOS

on:
  push:
    branches:
      - fix/cuda-reconnect-context-poisoning
    paths:
      - src/main.rs
      - src/miner.rs
      - src/pom_gpu.rs
      - plugins/cuda/src/worker.rs
      - integrations/hiveos/**
      - .github/workflows/validate-cuda-reconnect-compile.yml
  workflow_dispatch:

jobs:
  hiveos-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KERYX_LLAMA_SKIP: "1"
    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config curl unzip tar

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA 12.2 compiler
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.2.2'
          method: network
          sub-packages: '["nvcc"]'

      - name: Verify toolchain
        shell: bash
        run: |
          rustc -V
          cargo -V
          nvcc -V
          protoc --version
          ldd --version | head -1

      - name: Build patched Linux release miner and CUDA plugin
        shell: bash
        env:
          KERYX_LLAMA_SKIP: "1"
        run: |
          set -euxo pipefail
          export NVCC="$(command -v nvcc)"
          cargo build --release -p keryx-miner -p keryxcuda
          test -x target/release/keryx-miner
          test -f target/release/libkeryxcuda.so
          strip target/release/keryx-miner || true
          strip target/release/libkeryxcuda.so || true
          ldd target/release/keryx-miner || true
          ldd target/release/libkeryxcuda.so || true

      - name: Download official v0.5.4 HiveOS package
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://github.com/Keryx-Labs/keryx-miner/releases/download/v0.5.4-PoM/keryx-miner-v0.5.4_PoM_hiveos.tar.gz' \
            -o official-hiveos.tar.gz
          mkdir official-hiveos
          tar -xzf official-hiveos.tar.gz -C official-hiveos
          find official-hiveos -maxdepth 3 -type f -printf '%p\n' | sort

      - name: Replace only patched binaries in official HiveOS layout
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$(find official-hiveos -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$ROOT"

          MINER="$(find "$ROOT" -maxdepth 2 -type f \( -name 'keryx-miner' -o -name 'keryx-miner-*linux*' \) | head -n1)"
          CUDA_SO="$(find "$ROOT" -maxdepth 2 -type f -name 'libkeryxcuda.so' | head -n1)"
          LLAMA_SO="$(find "$ROOT" -maxdepth 2 -type f -name 'libkeryx-llama.so' | head -n1)"

          test -n "$MINER"
          test -n "$CUDA_SO"
          test -n "$LLAMA_SO"

          echo "Replacing official miner: $MINER"
          echo "Replacing official CUDA plugin: $CUDA_SO"
          echo "Keeping official llama engine unchanged: $LLAMA_SO"

          install -m 0755 target/release/keryx-miner "$MINER"
          install -m 0755 target/release/libkeryxcuda.so "$CUDA_SO"

          cat > "$ROOT/CUDA-RECONNECT-FIX.txt" <<EOF
          Keryx miner v0.5.4-PoM — HiveOS CUDA reconnect fix
          Branch: fix/cuda-reconnect-context-poisoning
          Commit: $GITHUB_SHA
          Build: Ubuntu 22.04 / Linux x86_64 GNU / CUDA 12.2.2
          Patched: keryx-miner + libkeryxcuda.so
          Unchanged from official v0.5.4-PoM: libkeryx-llama.so and HiveOS integration files
          Fix: do not recreate poisoned CUDA contexts in-process after Stratum disconnect;
               treat illegal-memory/illegal-address faults as fatal and require process restart.
          EOF

          mkdir -p dist
          ARCHIVE='dist/keryx-miner-v0.5.4-PoM-cuda-reconnect-fix-hiveos.tar.gz'
          tar -C "$(dirname "$ROOT")" -czf "$ARCHIVE" "$(basename "$ROOT")"
          sha256sum "$ARCHIVE" | tee dist/SHA256.txt

      - name: Verify packaged files
        shell: bash
        run: |
          set -euxo pipefail
          tar -tzf dist/keryx-miner-v0.5.4-PoM-cuda-reconnect-fix-hiveos.tar.gz | head -100

      - name: Upload compiled HiveOS miner
        uses: actions/upload-artifact@v4
        with:
          name: keryx-miner-v0.5.4-PoM-cuda-reconnect-fix-hiveos
          path: |
            dist/keryx-miner-v0.5.4-PoM-cuda-reconnect-fix-hiveos.tar.gz
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
