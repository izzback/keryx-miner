name: Build patched Keryx miner Windows

on:
  push:
    branches:
      - fix/cuda-reconnect-context-poisoning
    paths:
      - src/main.rs
      - src/miner.rs
      - src/pom_gpu.rs
      - plugins/cuda/src/worker.rs
      - .github/workflows/validate-cuda-reconnect-compile.yml
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      KERYX_LLAMA_SKIP: "1"
    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA 12.9 compiler
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.9.2'
          method: network
          sub-packages: '["nvcc"]'

      - name: Verify toolchain
        shell: powershell
        run: |
          rustc -V
          cargo -V
          nvcc -V
          protoc --version

      - name: Build patched release miner and CUDA plugin
        shell: powershell
        env:
          KERYX_LLAMA_SKIP: "1"
        run: |
          $env:NVCC = (Get-Command nvcc).Source
          cargo build --release -p keryx-miner -p keryxcuda
          if (!(Test-Path 'target\release\keryx-miner.exe')) { throw 'keryx-miner.exe missing' }
          if (!(Test-Path 'target\release\keryxcuda.dll')) { throw 'keryxcuda.dll missing' }

      - name: Retrieve official v0.5.4 llama engine
        shell: powershell
        run: |
          $url = 'https://github.com/Keryx-Labs/keryx-miner/releases/download/v0.5.4-PoM/keryx-miner-v0.5.4-PoM-win64-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile 'official-v0.5.4.zip'
          Expand-Archive -Path 'official-v0.5.4.zip' -DestinationPath 'official-v0.5.4' -Force
          $llama = Get-ChildItem 'official-v0.5.4' -Recurse -File -Filter 'keryx-llama.dll' | Select-Object -First 1
          if (-not $llama) { throw 'Official v0.5.4 keryx-llama.dll not found' }
          Copy-Item $llama.FullName 'target\release\keryx-llama.dll'
          Write-Host "Reusing official unchanged llama engine: $($llama.FullName)"

      - name: Stage Windows package
        shell: powershell
        run: |
          $out = 'dist\keryx-miner-v0.5.4-cuda-reconnect-fix-win64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'target\release\keryx-miner.exe' $out
          Copy-Item 'target\release\keryxcuda.dll' $out
          Copy-Item 'target\release\keryx-llama.dll' $out
          @"
          Keryx miner v0.5.4 CUDA reconnect fix
          Branch: fix/cuda-reconnect-context-poisoning
          Commit: $env:GITHUB_SHA
          Target: Windows x64 / MSVC
          PoM CUDA PTX compiled with CUDA 12.9.2
          keryx-llama.dll: unchanged official v0.5.4-PoM Windows release
          Primary target rig: RTX 3080 / sm_86
          "@ | Set-Content -Encoding UTF8 "$out\BUILD-INFO.txt"
          Compress-Archive -Path "$out\*" -DestinationPath 'dist\keryx-miner-v0.5.4-cuda-reconnect-fix-win64.zip' -Force
          Get-FileHash 'dist\keryx-miner-v0.5.4-cuda-reconnect-fix-win64.zip' -Algorithm SHA256 | Tee-Object -FilePath 'dist\SHA256.txt'

      - name: Upload compiled miner
        uses: actions/upload-artifact@v4
        with:
          name: keryx-miner-v0.5.4-cuda-reconnect-fix-win64
          path: |
            dist/keryx-miner-v0.5.4-cuda-reconnect-fix-win64.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
