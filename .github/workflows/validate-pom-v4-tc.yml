name: Validate PoM v4 Tensor Core port

on:
  push:
    branches:
      - perf/pom-v4-tensor-core-supr-0.11.6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cuda129:
    if: github.actor != 'github-actions[bot]'
    name: CUDA 12.9 kernel + Rust check
    runs-on: ubuntu-latest
    env:
      KERYX_LLAMA_SKIP: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/pom-v4-tensor-core-supr-0.11.6
          fetch-depth: 0

      - id: cuda
        name: Install CUDA 12.9 nvcc
        continue-on-error: true
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc"]'

      - id: prereqs
        name: Install build prerequisites
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler build-essential pkg-config cmake clang libclang-dev \
            libssl-dev ocl-icd-opencl-dev
          rustup component add rustfmt

      - id: nvcc80
        name: Compile PoM v4 kernel for Ampere
        continue-on-error: true
        run: |
          nvcc --version
          nvcc -ptx -O3 -arch=sm_80 cuda/pom_mine.cu -o /tmp/pom_mine_sm80.ptx
          grep -q 'pom_mine_v4_chase' /tmp/pom_mine_sm80.ptx
          grep -q 'pom_mine_v4_tc' /tmp/pom_mine_sm80.ptx

      - id: nvcc120
        name: Compile PoM v4 kernel for Blackwell
        continue-on-error: true
        run: |
          nvcc -ptx -O3 -arch=sm_120 cuda/pom_mine.cu -o /tmp/pom_mine_sm120.ptx
          grep -q 'pom_mine_v4_chase' /tmp/pom_mine_sm120.ptx
          grep -q 'pom_mine_v4_tc' /tmp/pom_mine_sm120.ptx

      - id: fmt
        name: Rust format check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - id: rustcheck
        name: Rust host compile check
        continue-on-error: true
        run: cargo check --lib

      - name: Publish validation result
        if: always()
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUDA_SETUP: ${{ steps.cuda.outcome }}
          PREREQS: ${{ steps.prereqs.outcome }}
          NVCC80: ${{ steps.nvcc80.outcome }}
          NVCC120: ${{ steps.nvcc120.outcome }}
          FMT: ${{ steps.fmt.outcome }}
          RUSTCHECK: ${{ steps.rustcheck.outcome }}
        run: |
          status=PASS
          for x in "$CUDA_SETUP" "$PREREQS" "$NVCC80" "$NVCC120" "$FMT" "$RUSTCHECK"; do
            if [ "$x" != "success" ]; then status=FAIL; fi
          done
          mkdir -p .validation
          cat > .validation/pom-v4-tc.txt <<EOF
          status=$status
          tested_sha=$TESTED_SHA
          cuda_setup=$CUDA_SETUP
          prereqs=$PREREQS
          nvcc_sm80=$NVCC80
          nvcc_sm120=$NVCC120
          rustfmt=$FMT
          cargo_check_lib=$RUSTCHECK
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .validation/pom-v4-tc.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record PoM v4 tensor-core validation $status"
            git push origin HEAD:perf/pom-v4-tensor-core-supr-0.11.6
          fi
          test "$status" = PASS
