name: Escrow claim fix test.2 release

on:
  push:
    branches: ["test/escrow-claim-fix-v0.4.9"]

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      KERYX_LLAMA_SKIP: "1"
      POM_SM_LIST: "89"
      KERYX_LLAMA_ARCHS: "89-virtual"

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply test.2 corrections
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          escrow = Path("src/escrow.rs")
          cargo = Path("Cargo.toml")

          text = escrow.read_text(encoding="utf-8")
          marker = "// Select one CSV window at a time."
          if marker not in text:
              raise SystemExit("CSV-window selector marker not found")

          before, after = text.split(marker, 1)
          old = "daa_score >= e.confirm_daa + CHALLENGE_WINDOW_BLOCKS + 10"
          count = after.count(old)
          if count < 2:
              raise SystemExit(f"expected at least 2 post-selector maturity checks, found {count}")
          after = after.replace(old, "daa_score >= e.confirm_daa + e.csv_window + 10", 2)
          text = before + marker + after

          needle = '''        let h6_claim = watcher.find_claim(1_000_000).expect("H6 claim must follow legacy cleanup");'''
          replacement = '''        assert!(
              watcher.find_claim(100_000).is_none(),
              "H6 escrows must remain locked until their own 792k CSV window matures"
          );

          let h6_claim = watcher.find_claim(1_000_000).expect("H6 claim must follow legacy cleanup");'''
          if needle not in text:
              raise SystemExit("regression-test insertion point not found")
          text = text.replace(needle, replacement, 1)
          escrow.write_text(text, encoding="utf-8", newline="\n")

          manifest = cargo.read_text(encoding="utf-8")
          old_version = 'version = "0.4.9-escrow-fix-test.1"'
          if old_version not in manifest:
              raise SystemExit("test.1 package version not found")
          manifest = manifest.replace(old_version, 'version = "0.4.9-escrow-fix-test.2"', 1)
          cargo.write_text(manifest, encoding="utf-8", newline="\n")

          print("test.2 source corrections applied")
          '@ | python -

      - name: Format source
        run: cargo fmt --all

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: false
          use-local-cache: false

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          vsversion: "2022"

      - name: Compile escrow regression test
        run: cargo test -p keryx-miner --lib --no-run legacy_escrows_are_claimed_before_h6_batch_and_h6_cycle_continues -- --exact

      - name: Build matching miner and CUDA plugin
        run: cargo build -p keryx-miner -p keryxcuda --release

      - name: Verify matched binaries
        shell: pwsh
        run: |
          if (!(Test-Path target/release/keryx-miner.exe)) { throw "keryx-miner.exe missing" }
          if (!(Test-Path target/release/keryxcuda.dll)) { throw "keryxcuda.dll missing" }
          Get-Item target/release/keryx-miner.exe, target/release/keryxcuda.dll | Format-Table Name,Length

      - name: Package test.2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/keryx-miner.exe dist/keryx-miner.exe
          Copy-Item target/release/keryxcuda.dll dist/keryxcuda.dll

          @"
          Keryx Miner v0.4.9-escrow-fix-test.2

          TEST BUILD for Windows / NVIDIA sm_89 (RTX 5080 focused).

          Escrow changes:
          - legacy pre-H6 36,000-DAA coinbase rewards are reclaimed first;
          - claim batches never mix CSV windows;
          - H6 rewards continue in homogeneous 792,000-DAA batches;
          - H6 maturity checks use each entry's real csv_window (792,000 DAA), not 36,000.

          IMPORTANT:
          keryx-miner.exe and keryxcuda.dll in this archive are a MATCHED PAIR.
          Replace BOTH files together. Do not use an older keryxcuda.dll with this EXE.

          KERYX_LLAMA_SKIP=1 was used for the build. Keep your existing compatible keryx-llama.dll
          next to the miner if you use in-process inference.
          "@ | Set-Content dist/README-TEST.txt -Encoding utf8

          $exeHash = (Get-FileHash dist/keryx-miner.exe -Algorithm SHA256).Hash.ToLower()
          $cudaHash = (Get-FileHash dist/keryxcuda.dll -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  keryx-miner.exe",
            "$cudaHash  keryxcuda.dll"
          ) | Set-Content dist/SHA256SUMS.txt -Encoding ascii

          Compress-Archive -Path dist/* -DestinationPath keryx-miner-v0.4.9-escrow-fix-test.2-win64-sm89.zip -Force

      - name: Commit corrected source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/escrow.rs Cargo.toml
          git rm .github/workflows/escrow-fix-test2-release.yml
          git commit -m "fix(escrow): preserve per-entry CSV maturity and matched CUDA plugin"
          git push origin HEAD:test/escrow-claim-fix-v0.4.9

      - name: Create GitHub test.2 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.9-escrow-fix-test.2"
          gh release create $tag keryx-miner-v0.4.9-escrow-fix-test.2-win64-sm89.zip dist/keryx-miner.exe dist/keryxcuda.dll dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target test/escrow-claim-fix-v0.4.9 `
            --title "Keryx Miner v0.4.9-escrow-fix-test.2" `
            --notes "TEST prerelease. Fixes legacy 36k escrow starvation while preserving the real 792k H6 maturity window. Windows package now ships a matched keryx-miner.exe + keryxcuda.dll pair; replace both together. sm_89 focused build for RTX 5080 testing." `
            --prerelease
