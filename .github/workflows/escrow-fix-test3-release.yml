name: Escrow claim fix test.3 release

on:
  push:
    branches: ["test/escrow-claim-fix-v0.4.9"]

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      KERYX_LLAMA_SKIP: "0"
      POM_SM_LIST: "90,89,86,80,75,70,61"
      KERYX_LLAMA_ARCHS: "75-real;80-real;86-real;89-real;89-virtual"

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump test version
        shell: pwsh
        run: |
          $p = 'Cargo.toml'
          $t = Get-Content $p -Raw
          $t = $t.Replace('version = "0.4.9-escrow-fix-test.2"','version = "0.4.9-escrow-fix-test.3"')
          Set-Content $p $t -Encoding utf8

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          protoc --version

      - name: Install CUDA toolkit with cuBLAS
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: false
          use-local-cache: false

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          vsversion: "2022"

      - name: Build miner, CUDA plugin, and llama runtime
        shell: pwsh
        run: |
          Write-Host "KERYX_LLAMA_SKIP=$env:KERYX_LLAMA_SKIP"
          nvcc --version
          cmake --version
          cargo build -p keryx-miner -p keryxcuda --release

      - name: Verify complete matched runtime
        shell: pwsh
        run: |
          $required = @(
            'target/release/keryx-miner.exe',
            'target/release/keryxcuda.dll',
            'target/release/keryx-llama.dll'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required runtime file: $f" }
            $item = Get-Item $f
            Write-Host "$f -> $($item.Length) bytes"
          }
          if ((Get-Item 'target/release/keryx-llama.dll').Length -lt 1000000) {
            throw 'keryx-llama.dll is unexpectedly small'
          }

      - name: Package self-contained test build
        shell: pwsh
        run: |
          $dist = 'dist-v0.4.9-escrow-fix-test.3'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/keryx-miner.exe $dist/
          Copy-Item target/release/keryxcuda.dll $dist/
          Copy-Item target/release/keryx-llama.dll $dist/
          @"
          Keryx Miner v0.4.9-escrow-fix-test.3

          TEST BUILD for escrow recovery.
          KERYX_LLAMA_SKIP=0.
          This package contains a matched keryx-miner.exe + keryxcuda.dll + keryx-llama.dll set.
          Keep the three files together in the same directory.

          Escrow behavior:
          - legacy 36,000-DAA coinbase escrows are caught up separately;
          - H6 escrows keep their real per-entry 792,000-DAA maturity;
          - normal H6 claims continue in homogeneous batches after legacy cleanup.
          "@ | Set-Content "$dist/README-TEST.txt" -Encoding utf8

          $hashLines = foreach ($f in @('keryx-miner.exe','keryxcuda.dll','keryx-llama.dll')) {
            $h = (Get-FileHash "$dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $hashLines | Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$dist/*" -DestinationPath 'keryx-miner-v0.4.9-escrow-fix-test.3-win64.zip' -Force

      - name: Commit version and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git rm .github/workflows/escrow-fix-test3-release.yml
          git commit -m "test: package escrow fix with llama runtime"
          git push origin HEAD:test/escrow-claim-fix-v0.4.9

      - name: Create GitHub test.3 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.4.9-escrow-fix-test.3' `
            'keryx-miner-v0.4.9-escrow-fix-test.3-win64.zip' `
            'dist-v0.4.9-escrow-fix-test.3/keryx-miner.exe' `
            'dist-v0.4.9-escrow-fix-test.3/keryxcuda.dll' `
            'dist-v0.4.9-escrow-fix-test.3/keryx-llama.dll' `
            'dist-v0.4.9-escrow-fix-test.3/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target test/escrow-claim-fix-v0.4.9 `
            --title 'Keryx Miner v0.4.9-escrow-fix-test.3' `
            --notes 'TEST prerelease. Same escrow fix as test.2, but rebuilt with KERYX_LLAMA_SKIP=0 and ships a matched keryx-miner.exe + keryxcuda.dll + keryx-llama.dll runtime set. H6 maturity remains 792,000 DAA per entry.' `
            --prerelease
