name: Apply CUDA reconnect fix

on:
  push:
    branches:
      - fix/cuda-reconnect-context-poisoning
    paths:
      - patches/apply_cuda_reconnect_fix.py
      - .github/workflows/validate-cuda-reconnect-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.5.4 fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic source edits
        run: python3 patches/apply_cuda_reconnect_fix.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          allowed="$(printf '%s\n' \
            plugins/cuda/src/worker.rs \
            src/main.rs \
            src/miner.rs \
            src/pom_gpu.rs | sort)"
          test "$changed" = "$allowed"

      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/miner.rs src/pom_gpu.rs plugins/cuda/src/worker.rs
          git commit -m "fix(cuda): restart process after sticky CUDA faults"
          git push origin HEAD:fix/cuda-reconnect-context-poisoning
