name: Apply test.3 safe recovery fix

on:
  push:
    branches:
      - test/escrow-safe-recovery-v0.4.9-test.3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[test3-source]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/escrow-safe-recovery-v0.4.9-test.3
          fetch-depth: 0

      - name: Patch test.3 sources
        shell: python
        run: |
          from pathlib import Path

          # ----- Cargo version -----
          cargo = Path("Cargo.toml")
          c = cargo.read_text(encoding="utf-8")
          old_version = 'version = "0.4.9-escrow-fix-test.2"'
          new_version = 'version = "0.4.9-escrow-fix-test.3"'
          if old_version in c:
              c = c.replace(old_version, new_version, 1)
          elif new_version not in c:
              raise SystemExit("unexpected Cargo version; refusing blind patch")
          cargo.write_text(c, encoding="utf-8")

          # ----- Non-destructive recovery -----
          path = Path("src/main.rs")
          text = path.read_text(encoding="utf-8")

          helper_marker = "async fn client_main(\n"
          if "fn merge_recovered_escrow_state(" not in text:
              if helper_marker not in text:
                  raise SystemExit("client_main marker missing; refusing blind patch")
              helpers = r'''
          fn merge_recovered_escrow_state(
              mut existing: escrow::EscrowState,
              recovered: escrow::EscrowState,
          ) -> Result<(escrow::EscrowState, usize), String> {
              let mut known = std::collections::HashMap::<(String, u32), usize>::with_capacity(existing.entries.len());
              for (index, entry) in existing.entries.iter().enumerate() {
                  let key = (entry.coinbase_txid.to_ascii_lowercase(), entry.output_index);
                  if known.insert(key.clone(), index).is_some() {
                      return Err(format!(
                          "Existing escrow state contains duplicate outpoint {}:{} — refusing destructive recovery",
                          key.0, key.1
                      ));
                  }
              }

              let mut added = 0usize;
              for mut entry in recovered.entries {
                  let key = (entry.coinbase_txid.to_ascii_lowercase(), entry.output_index);
                  if let Some(&existing_index) = known.get(&key) {
                      let old = &existing.entries[existing_index];
                      if old.amount_sompi != entry.amount_sompi
                          || old.confirm_daa != entry.confirm_daa
                          || (!old.block_hash.is_empty()
                              && !entry.block_hash.is_empty()
                              && !old.block_hash.eq_ignore_ascii_case(&entry.block_hash))
                      {
                          return Err(format!(
                              "Recovery API metadata mismatch for existing escrow outpoint {}:{} — refusing to overwrite local state",
                              key.0, key.1
                          ));
                      }
                      // The local record is authoritative for history/status. Recovery must
                      // never reset claimed/slashed/retry fields or a stored CSV window.
                      continue;
                  }

                  entry.coinbase_txid = key.0.clone();
                  known.insert(key, existing.entries.len());
                  existing.entries.push(entry);
                  added += 1;
              }
              Ok((existing, added))
          }

          fn load_existing_escrow_state_for_recovery(path: &std::path::Path) -> Result<escrow::EscrowState, String> {
              match fs::read_to_string(path) {
                  Ok(raw) => serde_json::from_str(&raw).map_err(|e| {
                      format!(
                          "Existing escrow state '{}' is corrupt: {}. Refusing --recover-escrow so the file is not overwritten.",
                          path.display(), e
                      )
                  }),
                  Err(e) if e.kind() == std::io::ErrorKind::NotFound => Ok(escrow::EscrowState::default()),
                  Err(e) => Err(format!("Failed to read existing escrow state '{}': {}", path.display(), e)),
              }
          }

          fn backup_existing_escrow_state(path: &std::path::Path) -> Result<Option<std::path::PathBuf>, String> {
              if !path.exists() {
                  return Ok(None);
              }
              let timestamp = std::time::SystemTime::now()
                  .duration_since(std::time::UNIX_EPOCH)
                  .map_err(|e| format!("System clock error while naming escrow backup: {}", e))?
                  .as_secs();
              let file_name = path.file_name().and_then(|s| s.to_str()).unwrap_or("escrow_state.json");
              let backup_name = format!("{}.pre-recover.{}.{}.bak", file_name, timestamp, std::process::id());
              let backup_path = path.with_file_name(backup_name);
              fs::copy(path, &backup_path).map_err(|e| {
                  format!(
                      "Failed to back up existing escrow state '{}' to '{}': {}",
                      path.display(), backup_path.display(), e
                  )
              })?;
              Ok(Some(backup_path))
          }

          fn pending_total_sompi(state: &escrow::EscrowState) -> Result<u64, String> {
              state
                  .entries
                  .iter()
                  .filter(|e| !e.claimed && !e.slashed && !e.orphan_slashed && e.orphan_retries == 0)
                  .try_fold(0u64, |total, e| {
                      total.checked_add(e.amount_sompi).ok_or_else(|| "Escrow pending amount overflow".to_string())
                  })
          }

          '''
              text = text.replace(helper_marker, helpers + helper_marker, 1)

          if "mod safe_recovery_merge_tests" not in text:
              test_marker = "fn filter_plugins(dirname: &str) -> Vec<String> {\n"
              if test_marker not in text:
                  raise SystemExit("filter_plugins marker missing; refusing blind patch")
              tests = r'''
          #[cfg(test)]
          mod safe_recovery_merge_tests {
              use super::*;

              fn entry(tx_byte: &str, index: u32) -> escrow::EscrowEntry {
                  escrow::EscrowEntry {
                      coinbase_txid: tx_byte.repeat(32),
                      block_hash: "11".repeat(32),
                      confirm_daa: 10,
                      amount_sompi: 20,
                      output_index: index,
                      claimed: false,
                      slashed: false,
                      orphan_slashed: false,
                      orphan_retries: 0,
                      orphan_retry_after_daa: None,
                      submit_retries: 0,
                      batch_cap: 0,
                      cap_set_daa: 0,
                      is_inference: false,
                      csv_window: 36_000,
                  }
              }

              #[test]
              fn preserves_entries_missing_from_api() {
                  let old = entry("aa", 1);
                  let existing = escrow::EscrowState { entries: vec![old.clone()] };
                  let (merged, added) = merge_recovered_escrow_state(existing, escrow::EscrowState::default()).unwrap();
                  assert_eq!(added, 0);
                  assert_eq!(merged.entries.len(), 1);
                  assert_eq!(merged.entries[0].coinbase_txid, old.coinbase_txid);
              }

              #[test]
              fn adds_only_new_outpoints() {
                  let existing = escrow::EscrowState { entries: vec![entry("aa", 1)] };
                  let recovered = escrow::EscrowState { entries: vec![entry("bb", 2)] };
                  let (merged, added) = merge_recovered_escrow_state(existing, recovered).unwrap();
                  assert_eq!(added, 1);
                  assert_eq!(merged.entries.len(), 2);
              }

              #[test]
              fn duplicate_does_not_reset_local_status_or_csv_window() {
                  let mut old = entry("aa", 1);
                  old.claimed = true;
                  old.slashed = true;
                  old.csv_window = 792_000;
                  let mut recovered = old.clone();
                  recovered.claimed = false;
                  recovered.slashed = false;
                  recovered.csv_window = 36_000;
                  let (merged, added) = merge_recovered_escrow_state(
                      escrow::EscrowState { entries: vec![old] },
                      escrow::EscrowState { entries: vec![recovered] },
                  )
                  .unwrap();
                  assert_eq!(added, 0);
                  assert!(merged.entries[0].claimed);
                  assert!(merged.entries[0].slashed);
                  assert_eq!(merged.entries[0].csv_window, 792_000);
              }

              #[test]
              fn rejects_duplicate_existing_outpoints() {
                  let e = entry("aa", 1);
                  let existing = escrow::EscrowState { entries: vec![e.clone(), e] };
                  assert!(merge_recovered_escrow_state(existing, escrow::EscrowState::default()).is_err());
              }

              #[test]
              fn rejects_metadata_mismatch_for_same_outpoint() {
                  let old = entry("aa", 1);
                  let mut changed = old.clone();
                  changed.amount_sompi += 1;
                  assert!(merge_recovered_escrow_state(
                      escrow::EscrowState { entries: vec![old] },
                      escrow::EscrowState { entries: vec![changed] },
                  )
                  .is_err());
              }

              #[test]
              fn corrupt_existing_state_fails_closed() {
                  let dir = tempfile::tempdir().unwrap();
                  let path = dir.path().join("escrow_state.json");
                  fs::write(&path, b"{broken").unwrap();
                  assert!(load_existing_escrow_state_for_recovery(&path).is_err());
                  assert_eq!(fs::read(&path).unwrap(), b"{broken");
              }
          }

          '''
              text = text.replace(test_marker, tests + test_marker, 1)

          old_comment = "    // Recovery mode: rebuild escrow_state.json from the Keryx public API, then exit.\n"
          new_comment = (
              "    // Recovery mode: merge claimable UTXOs from the Keryx public API into the existing state, then exit.\n"
              "    // Existing entries are authoritative and never deleted/reset; the current file is backed up first.\n"
          )
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)
          elif "Recovery mode: merge claimable UTXOs" not in text:
              raise SystemExit("recovery comment marker missing; refusing blind patch")

          start_marker = "        let (state, total_sompi) = recovered_escrow_state(api_entries)?;\n"
          end_marker = "        info!(\"State saved to '{}'.\", opt.escrow_state_file);\n"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              replacement = r'''        let (recovered, api_total_sompi) = recovered_escrow_state(api_entries)?;
              let api_count = recovered.entries.len();
              let state_path = std::path::Path::new(&opt.escrow_state_file);
              let existing = load_existing_escrow_state_for_recovery(state_path)?;
              let existing_count = existing.entries.len();
              let (state, added_count) = merge_recovered_escrow_state(existing, recovered)?;
              let final_count = state.entries.len();
              let final_pending_sompi = pending_total_sompi(&state)?;
              if final_count < existing_count {
                  return Err("Internal recovery invariant violated: merged state became smaller than existing state".into());
              }
              if shutdown_requested.load(Ordering::Acquire) {
                  return Err("Shutdown requested before recovered escrow state was saved".into());
              }
              if let Some(backup) = backup_existing_escrow_state(state_path)? {
                  info!("Existing escrow state backed up to '{}'.", backup.display());
              }
              escrow::save_state_atomic(state_path, &state)?;

              info!(
                  "Recovery merge complete — API: {} entries / {:.4} KRX; existing preserved: {}; new added: {}; final tracked: {} / {:.4} KRX pending",
                  api_count,
                  api_total_sompi as f64 / 1e8,
                  existing_count,
                  added_count,
                  final_count,
                  final_pending_sompi as f64 / 1e8
              );
              info!("Merged state saved atomically to '{}'.", opt.escrow_state_file);
          '''
              text = text[:start] + replacement + text[end:]
          elif "Recovery merge complete" not in text:
              raise SystemExit("destructive recovery save markers missing; refusing blind patch")

          path.write_text(text, encoding="utf-8")

          # ----- Rejection diagnostics only; no burn/slash semantic change -----
          ep = Path("src/escrow.rs")
          e = ep.read_text(encoding="utf-8")
          reject_marker = "            Some(msg) => {\n                // Retriable rejections:"
          if "raw rejection for claim" not in e:
              replacement = """            Some(msg) => {\n                debug!(\n                    \"EscrowWatcher: raw rejection for claim {} ({} output(s)): {}\",\n                    claim_txid, n_outputs, msg\n                );\n                // Retriable rejections:"""
              if reject_marker not in e:
                  raise SystemExit("rejection marker missing; refusing blind escrow patch")
              e = e.replace(reject_marker, replacement, 1)

          burned_marker = "                let batch_rejected = n_outputs > 1;\n"
          if "node reported {} burned escrow outpoint(s)" not in e:
              diagnostic = r'''                if !burned_set.is_empty() {
                      let mut burned_outpoints: Vec<String> = burned_set
                          .iter()
                          .map(|(txid, index)| format!("{}:{}", txid, index))
                          .collect();
                      burned_outpoints.sort();
                      debug!(
                          "EscrowWatcher: node reported {} burned escrow outpoint(s) for claim {}: {:?}",
                          burned_outpoints.len(),
                          claim_txid,
                          burned_outpoints
                      );
                  }
          '''
              if burned_marker not in e:
                  raise SystemExit("burned marker missing; refusing blind escrow patch")
              e = e.replace(burned_marker, diagnostic + burned_marker, 1)
          ep.write_text(e, encoding="utf-8")

      - name: Format and verify
        shell: bash
        run: |
          rustfmt --edition 2021 src/main.rs src/escrow.rs
          git diff --check
          grep -q 'version = "0.4.9-escrow-fix-test.3"' Cargo.toml
          grep -q 'Recovery merge complete' src/main.rs
          grep -q 'preserves_entries_missing_from_api' src/main.rs
          grep -q 'pre-recover' src/main.rs
          grep -q 'raw rejection for claim' src/escrow.rs
          ! grep -q 'let (state, total_sompi) = recovered_escrow_state(api_entries)' src/main.rs

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src/main.rs src/escrow.rs
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: safe escrow recovery and diagnostics [test3-source]"
          git push origin HEAD:test/escrow-safe-recovery-v0.4.9-test.3
